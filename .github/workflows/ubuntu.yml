name: Ubuntu

on:
  push:
    branches:
      - main
      - 'dev**'
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  release:
    types:
      - released

# Supersede in-progress pull-request runs; queue everything else so two runs on one ref never race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: jammy
            distro: humble
          - os: noble
            distro: jazzy
    container:
      # Carries Tesseract prebuilt under /opt/tesseract, and already has the ROS 2 apt source for its own codename.
      image: ghcr.io/tesseract-robotics/tesseract:${{ matrix.os }}-master
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: target_ws/src

      - name: Install Depends
        shell: bash
        run: |
          apt update -qq
          apt install -y ros-${{ matrix.distro }}-ros-base

      - name: Build and Tests
        uses: tesseract-robotics/colcon-action@v15
        with:
          before-script: source /opt/tesseract/install/setup.bash && source /opt/ros/${{ matrix.distro }}/setup.bash
          ccache-prefix: ${{ matrix.distro }}
          vcs-file: dependencies.repos
          # moveit_core is pulled in only by trac_ik_kinematics_plugin, which --packages-up-to below leaves
          # unbuilt. trac_ik_lib is skipped so the released binary cannot shadow the newer source build.
          rosdep-install-args: -iry --skip-keys="moveit_core trac_ik_lib"
          # The trac_ik repository ships five packages; this plugin needs only the library.
          upstream-args: --packages-up-to trac_ik_lib --cmake-args -DCMAKE_BUILD_TYPE=Release
          target-path: target_ws/src
          target-args: --cmake-args -DCMAKE_BUILD_TYPE=Debug -DTESSERACT_ENABLE_TESTING=ON
